# Todas las interfaces gestionadas y DHCP interno; las conexiones Ethernet nuevas se crean solas
[main]
plugins=keyfile
dhcp=internal

[ifupdown]
managed=true

[connectivity]
enabled=false

# La MAC aleatoria al buscar redes hace fallar a varios adaptadores USB y Realtek
[device]
wifi.scan-rand-mac-address=no
